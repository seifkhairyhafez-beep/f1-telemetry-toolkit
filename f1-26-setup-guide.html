<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 26 Setup Guide — Every Circuit, Every Style</title>
<style>
  :root{
    --bg:#0a0b0d;
    --panel:#15171a;
    --panel-2:#1c1f23;
    --line:#2a2d32;
    --text:#e8e9eb;
    --muted:#9aa0a6;
    --red:#e10600;
    --red-dim:#8a0500;
    --red-glow: rgba(225,6,0,0.35);
    --accent2:#2dd4bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(900px 500px at 85% -10%, rgba(225,6,0,0.10), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(225,6,0,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height:100vh;
  }
  .topbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px;
    background:rgba(10,11,13,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand .stripe{width:8px;height:34px;background:linear-gradient(var(--red),#7a0500);border-radius:2px;}
  .brand h1{font-size:19px; margin:0; letter-spacing:0.5px; font-weight:800;}
  .brand h1 span{color:var(--red);}
  .brand .tag{font-size:12px;color:var(--muted);margin-top:1px;}
  .nav-actions{display:flex; align-items:center; gap:10px;}
  .pill-toggle{
    display:flex; background:var(--panel-2); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px;
  }
  .pill-toggle button{
    border:none; background:transparent; color:var(--muted); padding:8px 16px; border-radius:999px;
    font-size:13px; font-weight:600; cursor:pointer; transition:all .15s ease; letter-spacing:0.2px;
  }
  .pill-toggle button.active.stable{background:var(--accent2); color:#04201c;}
  .pill-toggle button.active.aggressive{background:var(--red); color:#fff;}
  .back-btn{
    display:none; align-items:center; gap:6px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--text); padding:9px 16px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
  }
  .back-btn:hover{border-color:var(--red);}
  .container{max-width:1280px; margin:0 auto; padding:24px 28px 80px;}

  .notice{
    border:1px solid var(--red-dim); background:linear-gradient(90deg, rgba(225,6,0,0.10), rgba(225,6,0,0.02));
    border-radius:10px; padding:14px 18px; margin-bottom:24px; font-size:13.5px; line-height:1.55; color:var(--text);
  }
  .notice b{color:#ff6b63;}

  /* Grid view */
  .section-title{font-size:13px; text-transform:uppercase; letter-spacing:1.6px; color:var(--muted); margin:0 0 14px;}
  .track-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(252px,1fr)); gap:16px;
  }
  .track-card{
    background:linear-gradient(180deg, var(--panel), var(--panel-2));
    border:1px solid var(--line); border-radius:14px; padding:18px; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative; overflow:hidden;
  }
  .track-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--red); opacity:0; transition:opacity .15s;
  }
  .track-card:hover{transform:translateY(-3px); border-color:var(--red-dim); box-shadow:0 10px 30px -12px var(--red-glow);}
  .track-card:hover::before{opacity:1;}
  .tc-row{display:flex; align-items:center; justify-content:space-between;}
  .tc-round{font-size:11px; color:var(--muted); font-weight:700; letter-spacing:1px;}
  .tc-flag{font-size:22px;}
  .tc-name{font-size:17px; font-weight:800; margin:10px 0 2px;}
  .tc-country{font-size:12.5px; color:var(--muted);}
  .tc-meta{display:flex; gap:14px; margin-top:14px; font-size:11.5px; color:var(--muted);}
  .tc-meta b{color:var(--text); font-size:13px; display:block;}
  .tc-df{
    margin-top:14px; height:6px; border-radius:4px; background:var(--line); overflow:hidden;
  }
  .tc-df i{display:block; height:100%; background:linear-gradient(90deg,var(--accent2),var(--red));}
  .tc-df-label{font-size:10.5px; color:var(--muted); margin-top:6px; letter-spacing:0.5px; text-transform:uppercase;}

  /* Track detail view */
  .hero{
    display:flex; align-items:flex-end; justify-content:space-between; gap:20px; flex-wrap:wrap;
    border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:24px;
  }
  .hero-left{display:flex; gap:16px; align-items:center;}
  .hero-flag{font-size:46px; line-height:1;}
  .hero h2{font-size:30px; margin:0; font-weight:800;}
  .hero .sub{color:var(--muted); font-size:14px; margin-top:4px;}
  .hero-stats{display:flex; gap:26px;}
  .hero-stat{text-align:right;}
  .hero-stat .v{font-size:20px; font-weight:800;}
  .hero-stat .l{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1px;}

  .layout{display:grid; grid-template-columns:340px 1fr; gap:22px; align-items:start;}
  @media (max-width:980px){ .layout{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px;
  }
  .panel h3{font-size:13px; text-transform:uppercase; letter-spacing:1.6px; color:var(--muted); margin:0 0 16px; display:flex; align-items:center; gap:8px;}
  .panel h3::before{content:""; width:4px; height:14px; background:var(--red); border-radius:2px;}

  .corner-bars{display:flex; flex-direction:column; gap:10px; margin-bottom:18px;}
  .corner-row{display:grid; grid-template-columns:70px 1fr 28px; align-items:center; gap:10px; font-size:12.5px;}
  .corner-row .lbl{color:var(--muted);}
  .corner-row .bar{height:9px; background:var(--line); border-radius:5px; overflow:hidden;}
  .corner-row .bar i{display:block; height:100%; border-radius:5px;}
  .corner-row .slow i{background:#2dd4bf;}
  .corner-row .medium i{background:#f59e0b;}
  .corner-row .fast i{background:var(--red);}
  .corner-row .num{text-align:right; font-weight:700;}

  .info-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .info-list li{font-size:13px; line-height:1.5; padding-left:18px; position:relative; color:#cdd0d4;}
  .info-list li::before{content:"▸"; color:var(--red); position:absolute; left:0; top:0; font-size:12px;}
  .info-list.straights li::before{content:"—"; color:var(--accent2);}

  .subhead{font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--muted); margin:18px 0 8px;}
  .subhead:first-child{margin-top:0;}

  .style-note{
    margin-top:18px; padding:12px 14px; border-radius:10px; font-size:12.5px; line-height:1.55;
    border:1px solid var(--line); background:var(--panel-2); color:#cdd0d4;
  }
  .style-note b{color:var(--text);}

  /* Setup categories */
  .cat{margin-bottom:18px;}
  .cat-head{
    display:flex; align-items:center; gap:10px; margin-bottom:10px;
  }
  .cat-head .dot{width:9px; height:9px; border-radius:50%; background:var(--red);}
  .cat-head h4{font-size:14.5px; margin:0; font-weight:800; letter-spacing:0.3px;}
  .param-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:640px){ .param-grid{grid-template-columns:1fr;} }
  .param{
    background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:14px 16px;
    transition:border-color .15s ease;
  }
  .param:hover{border-color:var(--red-dim);}
  .param-top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .param-name{font-size:13px; font-weight:700; color:var(--text);}
  .param-value{font-size:17px; font-weight:800; color:var(--red); white-space:nowrap;}
  .param-value small{font-size:11px; color:var(--muted); font-weight:600;}
  .param-why{margin-top:8px; font-size:12.5px; line-height:1.55; color:#aeb2b7;}
  .param-why b{color:#d8dadc; font-weight:600;}

  .footer-note{
    margin-top:30px; padding:16px 18px; border-radius:12px; border:1px solid var(--line); background:var(--panel);
    font-size:12px; color:var(--muted); line-height:1.6;
  }
  .badge{
    display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:0.6px; text-transform:uppercase;
    padding:3px 9px; border-radius:999px; border:1px solid var(--line); color:var(--muted); margin-left:8px; vertical-align:middle;
  }
  .badge.new{color:#04201c; background:var(--accent2); border-color:var(--accent2);}

  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--red-dim);}
</style>
</head>

// ---- Style deltas applied on top of the track-derived baseline ----------
const STYLE = {
  stable: {
    label:"Stable / Safe", accent:"var(--accent2)",
    wing:+2, diffOn:+5, diffOff:+5, camber:+0.05, toeF:-0.01, toeR:+0.015,
    susp:-2, arb:-2, rideHeight:+3, brakePressure:-3, brakeBias:-1.5,
    tyrePressF:+0.2, tyrePressR:+0.2,
    blurb:"Softer, more planted and more forgiving. Slightly more wing, a more locked differential, softer suspension and a touch more ride height trade outright pace for predictability — a great base for race stints, traffic and changeable grip."
  },
  aggressive: {
    label:"Aggressive / Fast", accent:"var(--red)",
    wing:-3, diffOn:-5, diffOff:-5, camber:-0.10, toeF:+0.02, toeR:-0.01,
    susp:+3, arb:+2, rideHeight:-3, brakePressure:+3, brakeBias:+1.5,
    tyrePressF:-0.2, tyrePressR:-0.2,
    blurb:"Lower drag, sharper rotation and a stiffer, lower-riding platform aimed at outright lap time. Faster over a single lap, but less forgiving over kerbs, in traffic, and as the tyres wear down through a stint."
  }
};

// ---- helpers -------------------------------------------------------------
const clip = (v,lo,hi)=> Math.min(hi, Math.max(lo, v));
const r0 = v => Math.round(v);
const r5 = v => Math.round(v/5)*5; // transmission diff sliders move in steps of 5 in-game
const r1 = v => Math.round(v*10)/10;
const r2 = v => Math.round(v*100)/100;
const lvl = (v,lo,hi)=>{ const p=(v-lo)/(hi-lo); return p<=0.34?'low':p>=0.66?'high':'mid'; };
const styleTail = (style, planted, sharp) => style==='aggressive'
  ? ` In the <b>aggressive</b> trim it's nudged toward ${sharp} for outright pace.`
  : ` In the <b>stable</b> trim it's nudged toward ${planted} for a more predictable, race-ready balance.`;

function lowDriftStraight(t){ return t.straights[0].replace(/^The /,'').toLowerCase(); }
function topChallenge(t,i=0){ return t.challenges[i].toLowerCase(); }
function brakingChallenge(t){
  const found = t.challenges.find(c=>/brak|stop|lock/i.test(c));
  return (found || t.challenges[0]).toLowerCase();
}
function rotationChallenge(t){
  const found = t.challenges.find(c=>/traction|rotat|corner|esses|chicane|hairpin|twist|direction/i.test(c) && !/brak/i.test(c));
  return (found || t.challenges[t.challenges.length-1]).toLowerCase();
}

// On-the-fly brake bias guidance — a real technique in F1 25/26: most wheels and
// pads can have brake bias mapped to a paddle/stick shortcut so it can be nudged
// a click or two mid-lap, corner to corner, rather than left fixed all race.
function onTheFlyBias(t, base, style){
  const fwd = clip(base + 2, 50, 65);
  const bwd = clip(base - 2, 49, 64);
  return `Your setup screen number (<b>${base}%</b>) is only the <i>starting</i> point — most sim racers map brake bias to a wheel paddle, d-pad or stick shortcut so it can be nudged a click at a time — the in-game adjustment moves in whole <b>1% steps</b>, so one or two clicks (≈1–2%) is all it usually takes — corner to corner, without ever opening the menu. ${t.name} is a good example of why that matters: into ${brakingChallenge(t)}, shifting bias forward toward around <b>${fwd}%</b> loads the front axle harder, shortens the stop and helps the nose rotate in. Then, through ${rotationChallenge(t)}, easing it back toward roughly <b>${bwd}%</b> takes load off the fronts, lowers your lock-up risk on a trailed brake, and lets the rear rotate more freely into the apex. The simplest read on which way to move it: if the <b>front</b> tyres lock first on entry, you're too far forward — click it back; if the <b>rear</b> steps out or the car wants to spin on the way in, you're too far back — click it forward. ${style==='aggressive' ? `In the aggressive trim, lean on the forward end of that range to sharpen rotation — it's faster, but a single mistimed click costs you a spin.` : `In the stable trim, keep the swings small and favour the rearward half of that range — less ultimate rotation, but a much smaller chance of locking up or snapping the rear under pressure.`}`;
}

// ---- generation -----------------------------------------------------------
function genSetup(track, styleKey){
  const s = STYLE[styleKey];
  const t = track.tags;
  const cTotal = track.corners.slow + track.corners.medium + track.corners.fast;
  const corneringDemand = (track.corners.medium + track.corners.fast) / cTotal * 10;

  // ── Real community meta values, looked up per track (see META above) ──────
  // "stable" = the measured meta setup verbatim. "aggressive" nudges it toward
  // a sharper quali trim (a touch less wing, more diff rotation, stiffer, lower).
  const M = META[track.id] || [30,25,90,35,-3.5,-2.0,0,0.1,38,6,1,10,22,46,100,56,26,21];
  const A = styleKey === 'aggressive';
  const fw  = clip(r0(M[0]  + (A?-4:0)), 4, 50);
  const rw  = clip(r0(M[1]  + (A?-5:0)), 4, 50);
  const onT = clip(r5(M[2]  + (A?-5:0)), 50, 100);
  const offT= clip(r5(M[3]  + (A?-5:0)), 20, 55);
  const fCam= M[4];
  const rCam= M[5];
  const fToe= M[6];
  const rToe= M[7];
  const fSus= clip(r0(M[8]  + (A?2:0)), 1, 41);
  const rSus= clip(r0(M[9]  + (A?2:0)), 1, 41);
  const fARB= clip(r0(M[10] + (A?2:0)), 1, 21);
  const rARB= clip(r0(M[11] + (A?2:0)), 1, 21);
  const fRH = clip(r0(M[12] + (A?-2:0)), 10, 50);
  const rRH = clip(r0(M[13] + (A?-3:0)), 30, 60);
  const bp  = M[14];
  const fbb = clip(r0(M[15] + (A?1:0)), 50, 63);
  const ftp = M[16];
  const rtp = M[17];

  const result = [
    { name:"Aerodynamics", params:[
      { label:"Front Wing", value:`${fw}`, unit:"/ 50", why:EXPLAIN.frontWing(track,fw,styleKey) },
      { label:"Rear Wing", value:`${rw}`, unit:"/ 50", why:EXPLAIN.rearWing(track,rw,styleKey) },
    ]},
    { name:"Transmission", params:[
      { label:"On-Throttle Diff", value:`${onT}`, unit:"%", why:EXPLAIN.onThrottleDiff(track,onT,styleKey) },
      { label:"Off-Throttle Diff", value:`${offT}`, unit:"%", why:EXPLAIN.offThrottleDiff(track,offT,styleKey) },
    ]},
    { name:"Suspension Geometry", params:[
      { label:"Front Camber", value:`${fCam.toFixed(2)}`, unit:"°", why:EXPLAIN.frontCamber(track,fCam.toFixed(2),styleKey) },
      { label:"Rear Camber", value:`${rCam.toFixed(2)}`, unit:"°", why:EXPLAIN.rearCamber(track,rCam.toFixed(2),styleKey) },
      { label:"Front Toe (Out)", value:`${fToe.toFixed(2)}`, unit:"°", why:EXPLAIN.frontToe(track,fToe.toFixed(2),styleKey) },
      { label:"Rear Toe (In)", value:`${rToe.toFixed(2)}`, unit:"°", why:EXPLAIN.rearToe(track,rToe.toFixed(2),styleKey) },
    ]},
    { name:"Suspension", params:[
      { label:"Front Suspension", value:`${fSus}`, unit:"/ 41", why:EXPLAIN.frontSuspension(track,fSus,styleKey) },
      { label:"Rear Suspension", value:`${rSus}`, unit:"/ 41", why:EXPLAIN.rearSuspension(track,rSus,styleKey) },
      { label:"Front Anti-Roll Bar", value:`${fARB}`, unit:"/ 41", why:EXPLAIN.frontARB(track,fARB,styleKey) },
      { label:"Rear Anti-Roll Bar", value:`${rARB}`, unit:"/ 41", why:EXPLAIN.rearARB(track,rARB,styleKey) },
      { label:"Front Ride Height", value:`${fRH}`, unit:"", why:EXPLAIN.frontRideHeight(track,fRH,styleKey) },
      { label:"Rear Ride Height", value:`${rRH}`, unit:"", why:EXPLAIN.rearRideHeight(track,rRH,styleKey) },
    ]},
    { name:"Brakes", params:[
      { label:"Brake Pressure", value:`${bp}`, unit:"%", why:EXPLAIN.brakePressure(track,bp,styleKey) },
      { label:"Front Brake Bias", value:`${fbb}`, unit:"%", why:EXPLAIN.frontBrakeBias(track,fbb,styleKey) },
    ]},
    { name:"Tyres", params:[
      { label:"Front Tyre Pressure", value:`${ftp}`, unit:"psi", why:EXPLAIN.frontTyrePressure(track,ftp,styleKey) },
      { label:"Rear Tyre Pressure", value:`${rtp}`, unit:"psi", why:EXPLAIN.rearTyrePressure(track,rtp,styleKey) },
    ]},
  ];
  result.brakeBiasBase = fbb;
  result.onTheFlyBiasTip = onTheFlyBias(track, fbb, styleKey);
  return result;
}

// ---- app state & rendering -------------------------------------------------
const state = { view:"grid", trackId:null, style:"stable" };
const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
const styleToggle = document.getElementById('styleToggle');

styleToggle.addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  state.style = btn.dataset.style;
  [...styleToggle.querySelectorAll('button')].forEach(b=>b.classList.toggle('active', b===btn));
  render();
});
backBtn.addEventListener('click', ()=>{
  // Let the browser's own history take us back to the grid (keeps Back/Forward in sync with in-app nav).
  if(location.hash && location.hash!=='#') history.back();
  else { state.view='grid'; state.trackId=null; render(); window.scrollTo({top:0,behavior:'smooth'}); }
});

function go(trackId){
  // Push a real history entry so the browser's Back button returns to the grid.
  location.hash = 'track/' + trackId;
}

// Keep app state in sync with the URL hash — covers browser Back/Forward, refresh and deep links.
function applyHash(){
  const m = /^#track\/(.+)$/.exec(location.hash);
  if(m && TRACKS.some(t=>t.id===m[1])){
    state.view='detail'; state.trackId=m[1];
  } else {
    state.view='grid'; state.trackId=null;
  }
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('hashchange', applyHash);

function dfLabel(n){ return n<=2?'Very Low':n<=4?'Low':n<=6?'Medium':n<=8?'High':'Very High'; }

function renderGrid(){
  backBtn.style.display = 'none';
  app.innerHTML = `
    <div class="notice">
      <b>F1 26 setup note —</b> the 2026 regulations bring smaller, lighter cars with active aerodynamics, smaller tyres
      and a much higher reliance on electrical (ERS) deployment for straight-line speed, at the cost of significantly
      less mechanical and ground-effect downforce than the 2022-25 generation. Early hands-on impressions from the sim
      racing community (sites tracking the F1 26 DLC's launch) line up around a few practical conclusions baked into
      every recommendation below: <b>run more wing than you're used to</b> (the cars need the aero help in the corners,
      and active aero/ERS covers more of the straight-line cost than a low-drag rear wing used to); <b>run a lower
      on-throttle differential</b> than F1 25 (less mechanical grip plus a huge instant hit of ERS torque means an
      aggressively locked diff just spins the rear up); and <b>treat brakes and tyre pressures as the most
      track-and-feel-dependent settings of the lot</b> — lock-ups have been a recurring theme in early 2026 running, and
      the smaller tyres mean old pressure baselines don't carry over cleanly. Use everything here as an
      evidence-informed starting point, then trust your own seat-of-the-pants feedback over any single number.
    </div>
    <h2 class="section-title">2026 Calendar — select a circuit</h2>
    <div class="track-grid">
      ${TRACKS.map(t=>`
        <div class="track-card" data-id="${t.id}">
          <div class="tc-row">
            <span class="tc-round">ROUND ${String(t.round).padStart(2,'0')}</span>
            <span class="tc-flag">${t.flag}</span>
          </div>
          <div class="tc-name">${t.name}${t.isNew?'<span class="badge new">New for 26</span>':''}</div>
          <div class="tc-country">${t.country} · ${t.length} · ${t.laps} laps</div>
          <div class="tc-meta">
            <div><b>${t.corners.slow+t.corners.medium+t.corners.fast}</b>corners</div>
            <div><b>${t.corners.slow}S / ${t.corners.medium}M / ${t.corners.fast}F</b>slow/med/fast</div>
          </div>
          <div class="tc-df"><i style="width:${t.tags.df*10}%"></i></div>
          <div class="tc-df-label">Downforce demand — ${dfLabel(t.tags.df)}</div>
        </div>
      `).join('')}
    </div>
  `;
  app.querySelectorAll('.track-card').forEach(card=>{
    card.addEventListener('click', ()=> go(card.dataset.id));
  });
}

function renderDetail(){
  backBtn.style.display = 'inline-flex';
  const track = TRACKS.find(t=>t.id===state.trackId);
  const cats = genSetup(track, state.style);
  const cTotal = track.corners.slow+track.corners.medium+track.corners.fast;
  const pct = n => Math.round(n/cTotal*100);
  const styleObj = STYLE[state.style];

  app.innerHTML = `
    <div class="hero">
      <div class="hero-left">
        <div class="hero-flag">${track.flag}</div>
        <div>
          <h2>${track.name}${track.isNew?'<span class="badge new">New for 26</span>':''}</h2>
          <div class="sub">Round ${track.round} · ${track.country} · ${track.length} · ${track.laps} laps</div>
        </div>
      </div>
      <div class="hero-stats">
        <div class="hero-stat"><div class="v">${cTotal}</div><div class="l">Corners</div></div>
        <div class="hero-stat"><div class="v">${dfLabel(track.tags.df)}</div><div class="l">Downforce need</div></div>
        <div class="hero-stat"><div class="v">${dfLabel(track.tags.bm)}</div><div class="l">Bumpiness</div></div>
        <div class="hero-stat"><div class="v">${dfLabel(track.tags.td)}</div><div class="l">Tyre wear</div></div>
      </div>
    </div>
    ${track.dataNote ? `<div class="notice"><b>Limited real-world reference:</b> ${track.dataNote}</div>` : ``}

    <div class="layout">
      <div class="left-col">
        <div class="panel">
          <h3>Track Characteristics</h3>
          <div class="subhead">Corner profile</div>
          <div class="corner-bars">
            <div class="corner-row"><span class="lbl">Slow</span><span class="bar slow"><i style="width:${pct(track.corners.slow)}%"></i></span><span class="num">${track.corners.slow}</span></div>
            <div class="corner-row"><span class="lbl">Medium</span><span class="bar medium"><i style="width:${pct(track.corners.medium)}%"></i></span><span class="num">${track.corners.medium}</span></div>
            <div class="corner-row"><span class="lbl">Fast</span><span class="bar fast"><i style="width:${pct(track.corners.fast)}%"></i></span><span class="num">${track.corners.fast}</span></div>
          </div>
          <div class="subhead">Key straights / DRS zones</div>
          <ul class="info-list straights">${track.straights.map(s=>`<li>${s}</li>`).join('')}</ul>
          <div class="subhead">Main setup challenges</div>
          <ul class="info-list">${track.challenges.map(c=>`<li>${c}</li>`).join('')}</ul>
          <div class="style-note">
            <b>${styleObj.label} philosophy:</b> ${styleObj.blurb}
          </div>
        </div>
      </div>

      <div class="right-col">
        ${cats.map(cat=>`
          <div class="panel cat">
            <div class="cat-head"><span class="dot"></span><h4>${cat.name}</h4></div>
            <div class="param-grid">
              ${cat.params.map(p=>`
                <div class="param">
                  <div class="param-top">
                    <span class="param-name">${p.label}</span>
                    <span class="param-value">${p.value}<small> ${p.unit}</small></span>
                  </div>
                  <div class="param-why">${p.why}</div>
                </div>
              `).join('')}
            </div>
          </div>
          ${cat.name === "Brakes" ? `
          <div class="panel cat brake-tip">
            <div class="cat-head"><span class="dot" style="background:var(--accent2)"></span><h4>Adjusting Brake Bias On The Fly — Corner By Corner</h4></div>
            <div class="param-why" style="font-size:13px; line-height:1.65;">${cats.onTheFlyBiasTip}</div>
          </div>` : ``}
        `).join('')}
        <div class="footer-note">
          Values shown are community-informed starting points for the F1 26 handling model — built from this circuit's
          corner mix, braking demands, surface and the 2026 cars' lower mechanical downforce / higher ERS reliance, and
          cross-checked against early F1 26 community impressions (more wing, lower on-throttle diff, brakes and tyre
          pressures as the most track-dependent settings of all). Use them as a baseline and adjust to taste for your
          driving style, assists, fuel load and tyre compound.
        </div>
      </div>
    </div>
  `;
}

function render(){
  if(state.view==='grid') renderGrid();
  else renderDetail();
}

applyHash();
</script>
</body>
</html>
